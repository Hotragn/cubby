name: keep-awake
# Render's free plan sleeps after 15 idle minutes; judges shouldn't wait for a cold start.
on:
  schedule: [{ cron: "*/10 * * * *" }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 60 https://cubby-daycare.onrender.com/api/health || true
